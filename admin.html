:root{--bg:#06080d;--s:#0d121b;--s2:#121925;--line:#202a39;--t:#f4f7fb;--m:#94a3b8;--a:#8ef0d0;--b:#7ebdff;--danger:#ff9292}*{box-sizing:border-box}body{margin:0;background:radial-gradient(1000px 600px at 0 -10%,#0d3027 0,transparent 60%),var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif}.wrap{min-height:100vh;display:grid;grid-template-columns:255px 1fr}.side{border-right:1px solid var(--line);padding:24px 18px;position:sticky;top:0;height:100vh;background:rgba(6,8,13,.86);backdrop-filter:blur(20px)}.brand{display:flex;gap:11px;align-items:center;margin:0 8px 28px}.mark{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}.mark img{width:100%;height:100%;object-fit:cover}.brand b{display:block}.brand small{color:var(--m)}nav button{width:100%;text-align:left;border:0;background:transparent;color:var(--m);padding:11px 12px;border-radius:11px;margin:3px 0;cursor:pointer;font-weight:700}nav button:hover,nav button.on{background:var(--s2);color:var(--t)}.main{padding:34px;max-width:1450px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.top h1{font-size:31px;letter-spacing:-.04em;margin:0}.top p{color:var(--m);margin:5px 0 0}.btn{border:1px solid var(--line);background:var(--s2);color:var(--t);padding:10px 13px;border-radius:11px;cursor:pointer;font-weight:800}.btn.primary{background:linear-gradient(135deg,var(--a),#72d6b8);color:#06150f;border:0}.btn.danger{color:#ffc0c0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.012));border-radius:18px;padding:18px}.card small{color:var(--m)}.card strong{font-size:30px;display:block;margin-top:9px}.panel{margin-top:15px}.panel h2{margin:0 0 15px;font-size:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:10px 0}.field label{display:block;font async function api(url,opt={}){let r=await fetch(url,{headers:{...(opt.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(opt.headers||{})},...opt});if(r.status===401){showLogin();throw Error('auth')}let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Request failed');return d}
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
async function login(){try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('#lu').value,password:$('#lp').value})});start()}catch(e){if(e.message!=='auth')alert(e.message)}}
async function logout(){await fetch('/api/admin/logout',{method:'POST'});showLogin()}
function showLogin(){$('#loginView').classList.remove('hidden');$('#appView').classList.add('hidden')}
function showApp(){$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden')}
async function start(){try{await api('/api/admin/me');showApp();renderNav();await load('dashboard')}catch(e){showLogin()}}
function renderNav(){$('#nav').innerHTML=tabs.map(t=>`<button class="${current===t[0]?'on':''}" onclick="load('${t[0]}')">${t[1]}</button>`).join('')}
async function load(tab){current=tab;renderNav();$('#pageTitle').textContent=tabs.find(t=>t[0]===tab)?.[1]||tab;let c=$('#content');c.innerHTML='<div class="panel muted">Loading…</div>';if(tab==='dashboard')return dashboard();if(tab==='settings')return settings();if(['courses','course_modules','resources','jobs','services','sources'].includes(tab))return collection(tab);if(tab==='enrollments')return enrollments();if(tab==='uploads')return uploads();if(tab==='leads')return leads();if(tab==='certificates')return certificates();if(tab==='security')return security()}
async function dashboard(){let d=await api('/api/admin/dashboard');$('#content').innerHTML=`<div class="grid">${Object.entries(d).map(([k,v])=>`<div class="card"><small>${esc(k.toUpperCase())}</small><strong>${v}</strong></div>`).join('')}</div><div class="panel"><h2>Production backend is active</h2><p class="muted">Production data is stored in Supabase, uploaded files use Supabase Storage, and the Admin area uses authenticated server sessions. Keep APP_SECRET strong, COOKIE_SECURE enabled and statutory settings verified.</p></div>`}
async function settings(){let s=await api('/api/admin/settings');$('#brand').textContent=s.brand||'HR Connect Pakistan';$('#content').innerHTML=`<div class="panel"><h2>Brand & contact</h2><div class="row"><div class="field"><label>Brand name</label><input id="brandv" value="${esc(s.brand)}"></div><div class="field"><label>Tagline</label><input id="tagline" value="${esc(s.tagline)}"></div><div class="field"><label>Community URL</label><input id="community" value="${esc(s.community)}"></div><div class="field"><label>Contact</label><input id="contact" value="${esc(s.contact)}"></div><div class="field"><label>WhatsApp support number</label><input id="supportWhatsapp" placeholder="923001234567" value="${esc(s.supportWhatsapp||'')}"></div><div class="field"><label>Site author</label><input id="siteAuthor" value="${esc(s.siteAuthor||'Awais Minhas')}"></div><div class="field"><label>Author role</label><input id="siteAuthorRole" value="${esc(s.siteAuthorRole||'HR Professional | Trainer | Consultant')}"></div></div></div><div class="panel"><h2>Calculator configuration</h2><div class="row"><div class="field"><label>OT multiplier</label><input id="ot" type="number" step=".1" value="${s.otMultiplier}"></div><div class="field"><label>EOBI employee %</label><input id="ee" type="number" step=".01" value="${s.eobiEmployee}"></div><div class="field"><label>EOBI employer %</label><input id="eer" type="number" step=".01" value="${s.eobiEmployer}"></div><div class="field"><label>Social Security %</label><input id="pr" type="number" step=".01" value="${s.pessiRate}"></div><div class="field"><label>Verification label/date</label><input id="verification" value="${esc(s.verification)}"></div></div><div class="notice">Only enter statutory values verified from current official sources.</div></div><div class="panel"><h2>Certification settings</h2><div class="row"><div class="field"><label>Certificate issuer</label><input id="certIssuer" value="${esc(s.certificateIssuer||'Awais Minhas')}"></div><div class="field"><label>Issuer role / title</label><input id="certRole" value="${esc(s.certificateRole||'Founder / HR Professional')}"></div><div class="field"><label>Certificate prefix</label><input id="certPrefix" value="${esc(s.certificatePrefix||'HRC')}"></div><div class="field"><label>Default learning hours</label><input id="certHours" type="number" step=".5" value="${s.certificateHoursDefault??2}"></div></div><div class="notice">Certificates are uniquely numbered and publicly verifiable. Issue them only after the participant has actually completed the course or assessment.</div></div><div class="panel"><h2>Growth & monetization</h2><div class="row"><div class="field"><label>GA4 Measurement ID</label><input id="ga4Id" placeholder="G-XXXXXXXXXX" value="${esc(s.ga4Id||'')}"></div><div class="field"><label>AdSense client ID</label><input id="adsenseClient" placeholder="ca-pub-..." value="${esc(s.adsenseClient||'')}"></div><div class="field"><label>Search Console verification</label><input id="searchConsoleVerification" value="${esc(s.searchConsoleVerification||'')}"></div></div><div class="notice">Leave IDs blank until your own Google accounts are ready. The public site will not load ad or analytics scripts unless configured.</div></div><div class="panel"><h2>Announcement</h2><div class="field"><label>Text</label><input id="announcement" value="${esc(s.announcement)}"></div><div class="field"><label>Active</label><select id="announcementActive"><option value="false" ${!s.announcementActive?'selected':''}>No</option><option value="true" ${s.announcementActive?'selected':''}>Yes</option></select></div></div><button class="btn primary" onclick="saveSettings()">Save settings</button>`}
async function saveSettings(){await api('/api/admin/settings',{method:'PUT',body:JSON.stringify({brand:$('#brandv').value,tagline:$('#tagline').value,community:$('#community').value,contact:$('#contact').value,otMultiplier:+$('#ot').value,eobiEmployee:+$('#ee').value,eobiEmployer:+$('#eer').value,pessiRate:+$('#pr').value,verification:$('#verification').value,announcement:$('#announcement').value,announcementActive:$('#announcementActive').value==='true',certificateIssuer:$('#certIssuer').value,certificateRole:$('#certRole').value,certificatePrefix:$('#certPrefix').value,certificateHoursDefault:+$('#certHours').value,supportWhatsapp:$('#supportWhatsapp').value,ga4Id:$('#ga4Id').value,adsenseClient:$('#adsenseClient').value,searchConsoleVerification:$('#searchConsoleVerification').value,siteAuthor:$('#siteAuthor').value,siteAuthorRole:$('#siteAuthorRole').value})});toast('Settings saved')}
const forms={courses:[['title','Title (English)'],['title_ur','Title (Urdu)'],['description','Description (English)','textarea'],['description_ur','Description (Urdu)','textarea'],['price','Price / label'],['status','Status'],['published','Published','bool'],['sort_order','Sort order','number'],['certificate_enabled','Certificate enabled','bool'],['learning_hours','Learning hours','number'],['enrollment_open','Enrollment open','bool'],['price_amount','Price amount','number'],['currency','Currency'],['payment_url','Payment / checkout URL'],['payment_instructions','Payment instructions','textarea']],course_modules:[['course_id','Course ID','number'],['title','Module title'],['description','Description','textarea'],['module_type','Module type'],['content_url','External content URL'],['upload_id','Upload ID','number'],['duration_minutes','Duration minutes','number'],['required','Required','bool'],['published','Published','bool'],['sort_order','Sort order','number']],resources:[['title','Title (English)'],['title_ur','Title (Urdu)'],['description','Description (English)','textarea'],['description_ur','Description (Urdu)','textarea'],['type','File type'],['free','Free','bool'],['published','Published','bool'],['upload_id','Upload ID','number']],jobs:[['title','Job title (English)'],['title_ur','Job title (Urdu)'],['company','Company'],['location','Location'],['slug','SEO slug'],['date_posted','Date posted'],['valid_through','Valid through'],['employment_type','Employment type'],['experience','Experience'],['salary','Salary'],['description','Description (English)','textarea'],['description_ur','Description (Urdu)','textarea'],['apply_info','Apply information (English)','textarea'],['apply_info_ur','Apply information (Urdu)','textarea'],['apply_url','Direct apply URL'],['featured','Featured','bool'],['published','Published','bool']],services:[['title','Service title (English)'],['title_ur','Service title (Urdu)'],['description','Description (English)','textarea'],['description_ur','Description (Urdu)','textarea'],['price','Price / label'],['published','Published','bool']],articles:[['title','Article title (English)'],['title_ur','Article title (Urdu)'],['slug','SEO slug'],['excerpt','Excerpt (English)','textarea'],['excerpt_ur','Excerpt (Urdu)','textarea'],['body','Article body (English)','textarea'],['body_ur','Article body (Urdu)','textarea'],['category','Category'],['meta_title','SEO title (English)'],['meta_title_ur','SEO title (Urdu)'],['meta_description','Meta description (English)','textarea'],['meta_description_ur','Meta description (Urdu)','textarea'],['author','Author'],['published','Published','bool'],['featured','Featured','bool'],['published_at','Published date']],sources:[['title','Source title'],['authority','Authority'],['url','Source URL'],['jurisdiction','Jurisdiction'],['rule_type','Rule type'],['effective_date','Effective date'],['verified_date','Verified date'],['notes','Notes','textarea'],['active','Active','bool']]};
function inputFor(f,type,val=''){if(type==='textarea')return `<textarea id="f_${f}">${esc(val)}</textarea>`;if(type==='bool')return `<select id="f_${f}"><option value="1" ${val?'selected':''}>Yes</option><option value="0" ${!val?'selected':''}>No</option></select>`;return `<input id="f_${f}" type="${type==='number'?'number':'text'}" value="${esc(val)}">`}
async function collection(t){let list=await api('/api/admin/content/'+t);$('#content').innerHTML=`<div class="panel"><div class="top" style="margin:0 0 14px"><div><h2>${tabs.find(x=>x[0]===t)[1]}</h2><p class="muted">Create, edit, publish or remove records.</p></div><button class="btn primary" onclick="editItem('${t}')">+ Add new</button></div><div class="list">${list.map(x=>`<div class="item"><div><b>${esc(x.title||x.full_name||('Record #'+x.id))}</b><br><small>${esc(x.description||x.location||x.authority||x.email||'')}</small></div><div class="actions"><button class="btn" onclick='editItem(${JSON.stringify(t)},${JSON.stringify(x)})'>Edit</button><button class="btn danger" onclick="delItem('${t}',${x.id})">Delete</button></div></div>`).join('')||'<p class="muted">No records yet.</p>'}</div></div>`}
function editItem(t,x={}){let fs=forms[t];$('#content').innerHTML=`<div class="panel"><h2>${x.id?'Edit':'Add'} ${tabs.find(a=>a[0]===t)[1]}</h2>${fs.map(([f,l,ty])=>`<div class="field"><label>${l}</label>${inputFor(f,ty,x[f]??'')}</div>`).join('')}<div class="actions"><button class="btn primary" onclick="saveItem('${t}',${x.id||0})">Save</button><button class="btn" onclick="collection('${t}')">Cancel</button></div></div>`}
async function saveItem(t,id){let d={};for(let [f,l,ty] of forms[t]){let v=$('#f_'+f).value;d[f]=ty==='bool'?+v:ty==='number'?(v===''?0:+v):v}await api('/api/admin/content/'+t+(id?'/'+id:''),{method:id?'PUT':'POST',body:JSON.stringify(d)});toast('Saved');collection(t)}
async function delItem(t,id){if(!confirm('Delete this item?'))return;await api(`/api/admin/content/${t}/${id}`,{method:'DELETE'});toast('Deleted');collection(t)}
async function uploads(){let xs=await api('/api/admin/uploads');$('#content').innerHTML=`<div class="panel"><h2>Upload new file</h2><div class="row"><div class="field"><label>Display title</label><input id="ut"></div><div class="field"><label>Kind</label><select id="uk"><option>Resource</option><option>Course File</option><option>Template</option><option>Digital Product</option><option>Certificate</option></select></div><div class="field"><label>Price/access label</label><input id="up" value="Free"></div><div class="field"><label>Public download</label><select id="upub"><option value="1">Yes</option><option value="0">No</option></select></div></div><div class="fileInput"><input id="uf" type="file"></div><button class="btn primary" style="margin-top:12px" onclick="doUpload()">Upload file</button></div><div class="panel"><h2>Stored files</h2><div class="list">${xs.map(x=>`<div class="item"><div><b>${esc(x.title)}</b><br><small>${esc(x.kind)} · ${esc(x.filename)} · ${(x.size/1024/1024).toFixed(2)} MB · ${x.public?'Public':'Private'}</small></div><div class="actions"><a class="btn" href="/download/${x.id}">Download</a><button class="btn danger" onclick="delUpload(${x.id})">Delete</button></div></div>`).join('')||'<p class="muted">No uploads yet.</p>'}</div></div>`}
async function doUpload(){let f=$('#uf').files[0];if(!f)return alert('Choose a file');let fd=new FormData();fd.append('file',f);fd.append('title',$('#ut').value||f.name);fd.append('kind',$('#uk').value);fd.append('price',$('#up').value);fd.append('public',$('#upub').value);await api('/api/admin/uploads',{method:'POST',body:fd});toast('File uploaded');uploads()}
async function delUpload(id){if(!confirm('Delete this file?'))return;await api('/api/admin/uploads/'+id,{method:'DELETE'});toast('Deleted');uploads()}
async function enrollments(){let xs=await api('/api/admin/content/enrollments');$('#content').innerHTML=`<div class="panel"><h2>Course enrollments</h2><p class="muted">Track participant progress. Mark 100% only after completion has been verified; then issue the certificate from the Certificates tab.</p><div class="tableWrap"><table><thead><tr><th>Participant</th><th>Course ID</th><th>Status</th><th>Progress</th><th>Completed</th><th></th></tr></thead><tbody>${xs.map(x=>`<tr><td><b>${esc(x.full_name)}</b><br><small>${esc(x.email)} ${x.phone?'· '+esc(x.phone):''}</small></td><td>${x.course_id}</td><td><select id="es_${x.id}"><option ${x.status==='Enrolled'?'selected':''}>Enrolled</option><option ${x.status==='In Progress'?'selected':''}>In Progress</option><option ${x.status==='Completed'?'selected':''}>Completed</option><option ${x.status==='Cancelled'?'selected':''}>Cancelled</option></select></td><td><input id="ep_${x.id}" type="number" min="0" max="100" value="${x.progress||0}" style="width:80px"></td><td><input id="ec_${x.id}" type="date" value="${esc((x.completed_at||'').slice(0,10))}"></td><td><button class="btn" onclick="saveEnrollment(${x.id},${x.course_id},${JSON.stringify(x.full_name)},${JSON.stringify(x.email)})">Save</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No enrollments yet.</td></tr>'}</tbody></table></div></div>`}
async function saveEnrollment(id,course_id,name,email){let status=$('#es_'+id).value,progress=Math.max(0,Math.min(100,+$('#ep_'+id).value||0)),completed_at=$('#ec_'+id).value;if(status==='Completed'&&progress<100)progress=100;await api('/api/admin/content/enrollments/'+id,{method:'PUT',body:JSON.stringify({course_id,full_name:name,email,status,progress,completed_at})});toast('Enrollment updated');enrollments()}
async function leads(){let xs=await api('/api/admin/leads');$('#content').innerHTML=`<div class="panel"><h2>Incoming leads</h2><div class="tableWrap"><table><thead><tr><th>Type</th><th>Name</th><th>Contact</th><th>Status</th><th>Date</th><th></th></tr></thead><tbody>${xs.map(x=>`<tr><td>${esc(x.type)}</td><td>${esc(x.name)}</td><td>${esc(x.contact)}</td><td><select onchange="leadStatus(${x.id},this.value)"><option ${x.status==='New'?'selected':''}>New</option><option ${x.status==='Contacted'?'selected':''}>Contacted</option><option ${x.status==='Qualified'?'selected':''}>Qualified</option><option ${x.status==='Won'?'selected':''}>Won</option><option ${x.status==='Lost'?'selected':''}>Lost</option></select></td><td>${esc(x.created_at)}</td><td><button class="btn danger" onclick="delLead(${x.id})">Delete</button></td></tr>`).join('')}</tbody></table></div></div>`}
async function leadStatus(id,status){await api('/api/admin/leads/'+id,{method:'PATCH',body:JSON.stringify({status})});toast('Status updated')}async function delLead(id){if(!confirm('Delete lead?'))return;await api('/api/admin/leads/'+id,{method:'DELETE'});leads()}
async function certificates(){let xs=await api('/api/admin/certificates');let cs=await api('/api/admin/content/courses');$('#content').innerHTML=`<div class="panel"><div class="top" style="margin:0 0 14px"><div><h2>Issue verified certificate</h2><p class="muted">Issue only after confirmed course completion. Every certificate receives a unique public verification code.</p></div></div><div class="row"><div class="field"><label>Participant name</label><input id="cn"></div><div class="field"><label>Participant email</label><input id="ce" type="email"></div><div class="field"><label>Course</label><select id="cc"><option value="">Choose course</option>${cs.map(c=>`<option value="${c.id}" data-title="${esc(c.title)}">${esc(c.title)}</option>`).join('')}</select></div><div class="field"><label>Custom course title (optional)</label><input id="cct"></div><div class="field"><label>Completion date</label><input id="cd" type="date"></div><div class="field"><label>Learning hours</label><input id="ch" type="number" step=".5" min="0"></div></div><div class="field"><label>Internal notes</label><textarea id="cnotes"></textarea></div><button class="btn primary" onclick="issueCert()">Issue certificate</button></div><div class="panel"><h2>Issued certificates</h2><div class="tableWrap"><table><thead><tr><th>Certificate</th><th>Participant</th><th>Course</th><th>Status</th><th>Issued</th><th></th></tr></thead><tbody>${xs.map(x=>`<tr><td><b>${esc(x.certificate_no)}</b><br><small>${esc(x.verification_code)}</small></td><td>${esc(x.participant_name)}<br><small>${esc(x.participant_email||'')}</small></td><td>${esc(x.course_title)}</td><td><select onchange="certStatus(${x.id},this.value)"><option ${x.status==='Valid'?'selected':''}>Valid</option><option ${x.status==='Revoked'?'selected':''}>Revoked</option></select></td><td>${esc(x.issued_at||'')}</td><td><div class="actions"><a class="btn" href="/certificate/verify?code=${encodeURIComponent(x.verification_code)}" target="_blank">Verify</a><button class="btn danger" onclick="delCert(${x.id})">Delete</button></div></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No certificates issued yet.</td></tr>'}</tbody></table></div></div>`;if(!$('#cd').value)$('#cd').value=new Date().toISOString().slice(0,10)}
async function issueCert(){let course=$('#cc');let opt=course.options[course.selectedIndex];let body={participant_name:$('#cn').value,participant_email:$('#ce').value,course_id:course.value?+course.value:null,course_title:$('#cct').value||(opt?.dataset?.title||''),completion_date:$('#cd').value,learning_hours:+$('#ch').value||0,notes:$('#cnotes').value};let r=await api('/api/admin/certificates',{method:'POST',body:JSON.stringify(body)});toast('Certificate issued: '+r.certificate_no);certificates()}
async function certStatus(id,status){await api('/api/admin/certificates/'+id,{method:'PATCH',body:JSON.stringify({status})});toast('Certificate status updated')}
async function delCert(id){if(!confirm('Delete this certificate record? Revoking is usually better for audit history.'))return;await api('/api/admin/certificates/'+id,{method:'DELETE'});toast('Certificate deleted');certificates()}
function security(){$('#content').innerHTML=`<div class="panel"><h2>Change admin password</h2><div class="field"><label>Current password</label><input id="cp" type="password"></div><div class="field"><label>New password (minimum 12 characters)</label><input id="np" type="password"></div><button class="btn primary" onclick="changePw()">Change password</button><div class="notice">For public deployment also set a unique APP_SECRET and enable COOKIE_SECURE=1 behind HTTPS.</div></div>`}async function changePw(){await api('/api/admin/change-password',{method:'POST',body:JSON.stringify({current_password:$('#cp').value,new_password:$('#np').value})});toast('Password changed');$('#cp').value=$('#np').value=''}
start();
</script></body></html>
