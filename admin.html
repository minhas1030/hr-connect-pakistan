<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HR Connect Pakistan — Admin</title><style>
:root{--bg:#06080d;--s:#0d121b;--s2:#121925;--line:#202a39;--t:#f4f7fb;--m:#94a3b8;--a:#8ef0d0;--b:#7ebdff;--danger:#ff9292}*{box-sizing:border-box}body{margin:0;background:radial-gradient(1000px 600px at 0 -10%,#0d3027 0,transparent 60%),var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif}.wrap{min-height:100vh;display:grid;grid-template-columns:255px 1fr}.side{border-right:1px solid var(--line);padding:24px 18px;position:sticky;top:0;height:100vh;background:rgba(6,8,13,.86);backdrop-filter:blur(20px)}.brand{display:flex;gap:11px;align-items:center;margin:0 8px 28px}.mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--a),#65cbaa);color:#062016;display:grid;place-items:center;font-weight:950}.brand b{display:block}.brand small{color:var(--m)}nav button{width:100%;text-align:left;border:0;background:transparent;color:var(--m);padding:11px 12px;border-radius:11px;margin:3px 0;cursor:pointer;font-weight:700}nav button:hover,nav button.on{background:var(--s2);color:var(--t)}.main{padding:34px;max-width:1450px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.top h1{font-size:31px;letter-spacing:-.04em;margin:0}.top p{color:var(--m);margin:5px 0 0}.btn{border:1px solid var(--line);background:var(--s2);color:var(--t);padding:10px 13px;border-radius:11px;cursor:pointer;font-weight:800}.btn.primary{background:linear-gradient(135deg,var(--a),#72d6b8);color:#06150f;border:0}.btn.danger{color:#ffc0c0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.012));border-radius:18px;padding:18px}.card small{color:var(--m)}.card strong{font-size:30px;display:block;margin-top:9px}.panel{margin-top:15px}.panel h2{margin:0 0 15px;font-size:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--m);font-weight:800;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;background:#090d14;border:1px solid var(--line);color:var(--t);padding:11px 12px;border-radius:11px;outline:0}.field textarea{min-height:110px;resize:vertical}.list{display:grid;gap:9px}.item{display:flex;justify-content:space-between;gap:14px;align-items:center;border:1px solid var(--line);background:#0a0f17;padding:13px;border-radius:13px}.item small{color:var(--m)}.actions{display:flex;gap:7px;flex-wrap:wrap}.badge{font-size:10px;padding:5px 8px;border-radius:99px;background:#16251f;color:var(--a);font-weight:900}.muted{color:var(--m)}.login{max-width:430px;margin:13vh auto;padding:28px;border:1px solid var(--line);background:var(--s);border-radius:22px}.hidden{display:none!important}.toast{position:fixed;right:20px;bottom:20px;background:#12201b;border:1px solid #29483d;padding:12px 16px;border-radius:12px;display:none}.toast.show{display:block}.notice{border:1px solid #4b4020;background:#1b170d;color:#e8d7a2;padding:12px;border-radius:12px;margin-top:12px}.fileInput{padding:12px;border:1px dashed var(--line);border-radius:12px}.tableWrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--m)}@media(max-width:900px){.wrap{grid-template-columns:1fr}.side{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}nav{display:flex;overflow:auto}nav button{white-space:nowrap;width:auto}.main{padding:22px}.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px;flex-direction:column}}
</style></head><body>
<div id="loginView" class="login"><div class="brand"><div class="mark">HRC</div><div><b>Owner Admin</b><small>Secure server login</small></div></div><div class="field"><label>Username</label><input id="lu" value="admin"></div><div class="field"><label>Password</label><input id="lp" type="password"></div><button class="btn primary" style="width:100%" onclick="login()">Sign in</button><div class="notice">First local run default: admin / ChangeThisBeforeDeploy! — change it immediately before public deployment.</div></div>
<div id="appView" class="wrap hidden"><aside class="side"><div class="brand"><div class="mark">HRC</div><div><b id="brand">HR Connect Pakistan</b><small>Owner Control Center</small></div></div><nav id="nav"></nav></aside><main class="main"><div class="top"><div><h1 id="pageTitle">Dashboard</h1><p id="pageSub">Manage your platform without editing code.</p></div><div class="actions"><a class="btn" href="/">Open website</a><button class="btn" onclick="logout()">Logout</button></div></div><div id="content"></div></main></div><div class="toast" id="toast"></div>
<script>
const tabs=[['dashboard','Dashboard'],['settings','Site Settings'],['courses','Courses'],['resources','Resources'],['jobs','Jobs'],['services','Services'],['uploads','Uploads'],['leads','Leads'],['sources','Rule Sources'],['security','Security']];let current='dashboard';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function api(url,opt={}){let r=await fetch(url,{headers:{...(opt.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(opt.headers||{})},...opt});if(r.status===401){showLogin();throw Error('auth')}let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Request failed');return d}
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
async function login(){try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('#lu').value,password:$('#lp').value})});start()}catch(e){if(e.message!=='auth')alert(e.message)}}
async function logout(){await fetch('/api/admin/logout',{method:'POST'});showLogin()}
function showLogin(){$('#loginView').classList.remove('hidden');$('#appView').classList.add('hidden')}
function showApp(){$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden')}
async function start(){try{await api('/api/admin/me');showApp();renderNav();await load('dashboard')}catch(e){showLogin()}}
function renderNav(){$('#nav').innerHTML=tabs.map(t=>`<button class="${current===t[0]?'on':''}" onclick="load('${t[0]}')">${t[1]}</button>`).join('')}
async function load(tab){current=tab;renderNav();$('#pageTitle').textContent=tabs.find(t=>t[0]===tab)?.[1]||tab;let c=$('#content');c.innerHTML='<div class="panel muted">Loading…</div>';if(tab==='dashboard')return dashboard();if(tab==='settings')return settings();if(['courses','resources','jobs','services','sources'].includes(tab))return collection(tab);if(tab==='uploads')return uploads();if(tab==='leads')return leads();if(tab==='security')return security()}
async function dashboard(){let d=await api('/api/admin/dashboard');$('#content').innerHTML=`<div class="grid">${Object.entries(d).map(([k,v])=>`<div class="card"><small>${esc(k.toUpperCase())}</small><strong>${v}</strong></div>`).join('')}</div><div class="panel"><h2>Production backend is active</h2><p class="muted">Content is stored server-side in SQLite, uploads are stored on the server, and the Admin area uses authenticated sessions. For public hosting, use persistent disk/storage, HTTPS, a strong APP_SECRET and a changed admin password.</p></div>`}
async function settings(){let s=await api('/api/admin/settings');$('#brand').textContent=s.brand||'HR Connect Pakistan';$('#content').innerHTML=`<div class="panel"><h2>Brand & contact</h2><div class="row"><div class="field"><label>Brand name</label><input id="brandv" value="${esc(s.brand)}"></div><div class="field"><label>Tagline</label><input id="tagline" value="${esc(s.tagline)}"></div><div class="field"><label>Community URL</label><input id="community" value="${esc(s.community)}"></div><div class="field"><label>Contact</label><input id="contact" value="${esc(s.contact)}"></div></div></div><div class="panel"><h2>Calculator configuration</h2><div class="row"><div class="field"><label>OT multiplier</label><input id="ot" type="number" step=".1" value="${s.otMultiplier}"></div><div class="field"><label>EOBI employee %</label><input id="ee" type="number" step=".01" value="${s.eobiEmployee}"></div><div class="field"><label>EOBI employer %</label><input id="eer" type="number" step=".01" value="${s.eobiEmployer}"></div><div class="field"><label>Social Security %</label><input id="pr" type="number" step=".01" value="${s.pessiRate}"></div><div class="field"><label>Verification label/date</label><input id="verification" value="${esc(s.verification)}"></div></div><div class="notice">Only enter statutory values verified from current official sources.</div></div><div class="panel"><h2>Announcement</h2><div class="field"><label>Text</label><input id="announcement" value="${esc(s.announcement)}"></div><div class="field"><label>Active</label><select id="announcementActive"><option value="false" ${!s.announcementActive?'selected':''}>No</option><option value="true" ${s.announcementActive?'selected':''}>Yes</option></select></div></div><button class="btn primary" onclick="saveSettings()">Save settings</button>`}
async function saveSettings(){await api('/api/admin/settings',{method:'PUT',body:JSON.stringify({brand:$('#brandv').value,tagline:$('#tagline').value,community:$('#community').value,contact:$('#contact').value,otMultiplier:+$('#ot').value,eobiEmployee:+$('#ee').value,eobiEmployer:+$('#eer').value,pessiRate:+$('#pr').value,verification:$('#verification').value,announcement:$('#announcement').value,announcementActive:$('#announcementActive').value==='true'})});toast('Settings saved')}
const forms={courses:[['title','Title'],['description','Description','textarea'],['price','Price / label'],['status','Status'],['published','Published','bool'],['sort_order','Sort order','number']],resources:[['title','Title'],['description','Description','textarea'],['type','File type'],['free','Free','bool'],['published','Published','bool'],['upload_id','Upload ID','number']],jobs:[['title','Job title'],['company','Company'],['location','Location'],['employment_type','Employment type'],['experience','Experience'],['salary','Salary'],['description','Description','textarea'],['apply_info','Apply information','textarea'],['published','Published','bool']],services:[['title','Service title'],['description','Description','textarea'],['price','Price / label'],['published','Published','bool']],sources:[['title','Source title'],['authority','Authority'],['url','Source URL'],['jurisdiction','Jurisdiction'],['rule_type','Rule type'],['effective_date','Effective date'],['verified_date','Verified date'],['notes','Notes','textarea'],['active','Active','bool']]};
function inputFor(f,type,val=''){if(type==='textarea')return `<textarea id="f_${f}">${esc(val)}</textarea>`;if(type==='bool')return `<select id="f_${f}"><option value="1" ${val?'selected':''}>Yes</option><option value="0" ${!val?'selected':''}>No</option></select>`;return `<input id="f_${f}" type="${type==='number'?'number':'text'}" value="${esc(val)}">`}
async function collection(t){let list=await api('/api/admin/content/'+t);$('#content').innerHTML=`<div class="panel"><div class="top" style="margin:0 0 14px"><div><h2>${tabs.find(x=>x[0]===t)[1]}</h2><p class="muted">Create, edit, publish or remove records.</p></div><button class="btn primary" onclick="editItem('${t}')">+ Add new</button></div><div class="list">${list.map(x=>`<div class="item"><div><b>${esc(x.title)}</b><br><small>${esc(x.description||x.location||x.authority||'')}</small></div><div class="actions"><button class="btn" onclick='editItem(${JSON.stringify(t)},${JSON.stringify(x)})'>Edit</button><button class="btn danger" onclick="delItem('${t}',${x.id})">Delete</button></div></div>`).join('')||'<p class="muted">No records yet.</p>'}</div></div>`}
function editItem(t,x={}){let fs=forms[t];$('#content').innerHTML=`<div class="panel"><h2>${x.id?'Edit':'Add'} ${tabs.find(a=>a[0]===t)[1]}</h2>${fs.map(([f,l,ty])=>`<div class="field"><label>${l}</label>${inputFor(f,ty,x[f]??'')}</div>`).join('')}<div class="actions"><button class="btn primary" onclick="saveItem('${t}',${x.id||0})">Save</button><button class="btn" onclick="collection('${t}')">Cancel</button></div></div>`}
async function saveItem(t,id){let d={};for(let [f,l,ty] of forms[t]){let v=$('#f_'+f).value;d[f]=ty==='bool'?+v:ty==='number'?(v===''?0:+v):v}await api('/api/admin/content/'+t+(id?'/'+id:''),{method:id?'PUT':'POST',body:JSON.stringify(d)});toast('Saved');collection(t)}
async function delItem(t,id){if(!confirm('Delete this item?'))return;await api(`/api/admin/content/${t}/${id}`,{method:'DELETE'});toast('Deleted');collection(t)}
async function uploads(){let xs=await api('/api/admin/uploads');$('#content').innerHTML=`<div class="panel"><h2>Upload new file</h2><div class="row"><div class="field"><label>Display title</label><input id="ut"></div><div class="field"><label>Kind</label><select id="uk"><option>Resource</option><option>Course File</option><option>Template</option><option>Digital Product</option><option>Certificate</option></select></div><div class="field"><label>Price/access label</label><input id="up" value="Free"></div><div class="field"><label>Public download</label><select id="upub"><option value="1">Yes</option><option value="0">No</option></select></div></div><div class="fileInput"><input id="uf" type="file"></div><button class="btn primary" style="margin-top:12px" onclick="doUpload()">Upload file</button></div><div class="panel"><h2>Stored files</h2><div class="list">${xs.map(x=>`<div class="item"><div><b>${esc(x.title)}</b><br><small>${esc(x.kind)} · ${esc(x.filename)} · ${(x.size/1024/1024).toFixed(2)} MB · ${x.public?'Public':'Private'}</small></div><div class="actions"><a class="btn" href="/download/${x.id}">Download</a><button class="btn danger" onclick="delUpload(${x.id})">Delete</button></div></div>`).join('')||'<p class="muted">No uploads yet.</p>'}</div></div>`}
async function doUpload(){let f=$('#uf').files[0];if(!f)return alert('Choose a file');let fd=new FormData();fd.append('file',f);fd.append('title',$('#ut').value||f.name);fd.append('kind',$('#uk').value);fd.append('price',$('#up').value);fd.append('public',$('#upub').value);await api('/api/admin/uploads',{method:'POST',body:fd});toast('File uploaded');uploads()}
async function delUpload(id){if(!confirm('Delete this file?'))return;await api('/api/admin/uploads/'+id,{method:'DELETE'});toast('Deleted');uploads()}
async function leads(){let xs=await api('/api/admin/leads');$('#content').innerHTML=`<div class="panel"><h2>Incoming leads</h2><div class="tableWrap"><table><thead><tr><th>Type</th><th>Name</th><th>Contact</th><th>Status</th><th>Date</th><th></th></tr></thead><tbody>${xs.map(x=>`<tr><td>${esc(x.type)}</td><td>${esc(x.name)}</td><td>${esc(x.contact)}</td><td><select onchange="leadStatus(${x.id},this.value)"><option ${x.status==='New'?'selected':''}>New</option><option ${x.status==='Contacted'?'selected':''}>Contacted</option><option ${x.status==='Qualified'?'selected':''}>Qualified</option><option ${x.status==='Won'?'selected':''}>Won</option><option ${x.status==='Lost'?'selected':''}>Lost</option></select></td><td>${esc(x.created_at)}</td><td><button class="btn danger" onclick="delLead(${x.id})">Delete</button></td></tr>`).join('')}</tbody></table></div></div>`}
async function leadStatus(id,status){await api('/api/admin/leads/'+id,{method:'PATCH',body:JSON.stringify({status})});toast('Status updated')}async function delLead(id){if(!confirm('Delete lead?'))return;await api('/api/admin/leads/'+id,{method:'DELETE'});leads()}
function security(){$('#content').innerHTML=`<div class="panel"><h2>Change admin password</h2><div class="field"><label>Current password</label><input id="cp" type="password"></div><div class="field"><label>New password (minimum 12 characters)</label><input id="np" type="password"></div><button class="btn primary" onclick="changePw()">Change password</button><div class="notice">For public deployment also set a unique APP_SECRET and enable COOKIE_SECURE=1 behind HTTPS.</div></div>`}async function changePw(){await api('/api/admin/change-password',{method:'POST',body:JSON.stringify({current_password:$('#cp').value,new_password:$('#np').value})});toast('Password changed');$('#cp').value=$('#np').value=''}
start();
</script></body></html>
